<template>
    <div
        class="min-h-screen bg-linear-to-br from-slate-100 via-blue-50 to-slate-200 dark:from-slate-950 dark:via-blue-950 dark:to-slate-900 flex flex-col items-center justify-center p-8">

        <!-- Logo / title -->
        <div class="text-center mb-12">
            <div class="flex items-center justify-center gap-3 mb-3">
                <div class="w-10 h-10 rounded-xl bg-blue-500 flex items-center justify-center">
                    <svg class="w-6 h-6 text-gray-900 dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">DCC Rail Commander</h1>
            </div>
            <p class="text-blue-600 dark:text-blue-300 text-sm">DCC-EX Device Configuration &amp; Programming Tool</p>
        </div>

        <!-- ── Splash (initial render, before attached() fires) ── -->
        <div if.bind="phase === 'splash'" class="flex flex-col items-center gap-3 opacity-60">
            <div class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></div>
        </div>

        <!-- ── Welcome (first launch only) ── -->
        <div if.bind="phase === 'welcome'"
            class="w-full max-w-md bg-gray-900/5 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-2xl p-6 flex flex-col gap-5">
            <div class="text-center">
                <h2 class="text-gray-900 dark:text-white font-semibold text-base">Welcome</h2>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">A couple of quick preferences to get
                    started. You can change these anytime from Settings.</p>
            </div>

            <div class="flex items-start justify-between gap-4">
                <div class="min-w-0">
                    <p class="text-sm font-medium text-gray-900 dark:text-white">Theme</p>
                    <p class="text-xs text-gray-500 mt-0.5">Light, dark, or follow your system setting.</p>
                </div>
                <div class="shrink-0 flex items-center gap-1 p-1 rounded-lg bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10">
                    <button click.trigger="setTheme('light')" data-testid="welcome-theme-light"
                        class="px-3 py-1.5 rounded-md text-xs font-semibold transition-colors"
                        class.bind="theme.mode === 'light'
                            ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm'
                            : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'">
                        Light
                    </button>
                    <button click.trigger="setTheme('dark')" data-testid="welcome-theme-dark"
                        class="px-3 py-1.5 rounded-md text-xs font-semibold transition-colors"
                        class.bind="theme.mode === 'dark'
                            ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm'
                            : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'">
                        Dark
                    </button>
                    <button click.trigger="setTheme('system')" data-testid="welcome-theme-system"
                        class="px-3 py-1.5 rounded-md text-xs font-semibold transition-colors"
                        class.bind="theme.mode === 'system'
                            ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm'
                            : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'">
                        System
                    </button>
                </div>
            </div>

            <div class="flex items-start justify-between gap-4">
                <div class="min-w-0">
                    <p class="text-sm font-medium text-gray-900 dark:text-white">Config editors</p>
                    <p class="text-xs text-gray-500 mt-0.5">Open each config file's visual form, or its raw text,
                        by default. Some settings are only editable as raw text, and will open there regardless.</p>
                </div>
                <div class="shrink-0 flex items-center gap-1 p-1 rounded-lg bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10">
                    <button click.trigger="setDefaultEditorView('visual')" data-testid="welcome-default-view-visual"
                        class="px-3 py-1.5 rounded-md text-xs font-semibold transition-colors"
                        class.bind="editorDefaultView.value === 'visual'
                            ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm'
                            : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'">
                        Visual
                    </button>
                    <button click.trigger="setDefaultEditorView('raw')" data-testid="welcome-default-view-raw"
                        class="px-3 py-1.5 rounded-md text-xs font-semibold transition-colors"
                        class.bind="editorDefaultView.value === 'raw'
                            ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm'
                            : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'">
                        Raw
                    </button>
                </div>
            </div>

            <button click.trigger="finishWelcome()" data-testid="welcome-continue"
                class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-white text-sm font-semibold transition-colors">
                Get Started
            </button>
        </div>

        <!-- ── Checking ── -->
        <div if.bind="phase === 'checking'" class="flex flex-col items-center gap-4">
            <svg class="w-8 h-8 text-blue-400 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <p class="text-blue-600 dark:text-blue-300 text-sm">${statusMessage}</p>
        </div>

        <!-- ── Preparing the bundled toolchain (first run of a new build) ── -->
        <div if.bind="phase === 'seeding'" class="w-full max-w-sm flex flex-col gap-4">
            <div class="text-center">
                <p class="text-gray-900 dark:text-white font-medium text-sm mb-1">${statusMessage}</p>
                <p class="text-blue-700/70 dark:text-blue-300/60 text-xs">
                    Unpacking the bundled build tools — this happens once per update.
                </p>
            </div>
            <div class="bg-gray-900/10 dark:bg-white/10 rounded-full h-2 overflow-hidden">
                <div class="h-full bg-blue-500 rounded-full transition-all duration-300" css="width: ${progress}%">
                </div>
            </div>
            <p class="text-gray-500 text-xs text-center">${progress}%</p>
        </div>

        <!-- ── Toolchain pack prompt (boards outside the bundled set) ── -->
        <div if.bind="phase === 'toolchain-prompt'"
            class="w-full max-w-sm bg-gray-900/5 dark:bg-white/5 border border-amber-500/20 rounded-2xl p-6 flex flex-col gap-5">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 110 20A10 10 0 0112 2z" />
                    </svg>
                    <h2 class="text-gray-900 dark:text-white font-semibold text-base">Toolchain Pack Required</h2>
                </div>
                <p class="text-gray-500 dark:text-gray-400 text-sm">
                    DCC-Rail-Commander bundles the AVR and ESP32 build toolchains. Other boards
                    (such as the STM32 Nucleo family) need a toolchain pack supplied from
                    a local archive.
                </p>
            </div>
            <div class="space-y-2">
                <button click.trigger="browseToolchainPack()" disabled.bind="browseBusy"
                    class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 rounded-lg text-white text-sm font-semibold transition-colors">
                    ${browseBusy ? 'Opening...' : 'Import Toolchain Pack (.tar.gz / .zip)'}
                </button>
                <button click.trigger="skipToolchainPack()" disabled.bind="browseBusy"
                    class="w-full py-2.5 bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 border border-gray-200 dark:border-white/10 rounded-lg text-gray-500 dark:text-gray-400 text-xs transition-colors disabled:opacity-50">
                    Skip — continue without it
                </button>
            </div>
            <div if.bind="browseError"
                class="bg-red-100 dark:bg-red-900/20 border border-red-400 dark:border-red-500/30 rounded-xl p-3 text-red-800 dark:text-red-300 text-xs">
                ${browseError}
            </div>
        </div>

        <!-- ── Error ── -->
        <div if.bind="phase === 'error'"
            class="w-full max-w-sm bg-red-100 dark:bg-red-900/20 border border-red-400 dark:border-red-500/30 rounded-2xl p-6 flex flex-col gap-4">
            <div class="flex items-start gap-3">
                <svg class="w-5 h-5 text-red-600 dark:text-red-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                </svg>
                <div>
                    <p class="text-red-800 dark:text-red-300 font-medium text-sm">Setup failed</p>
                    <p class="text-red-700/80 dark:text-red-400/80 text-xs mt-1">${error}</p>
                </div>
            </div>
            <button click.trigger="retry()"
                class="w-full py-2.5 bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 border border-gray-200 dark:border-white/10 rounded-lg text-gray-900 dark:text-white text-sm transition-colors">
                Retry
            </button>
        </div>

    </div>
</template>
