<template>
    <div class="flex flex-col flex-1 min-h-0 overflow-hidden">

        <div class="flex items-center gap-0 border-b border-gray-200 dark:border-white/10 bg-gray-50/80 dark:bg-gray-900/60 shrink-0 px-2">
            <button click.trigger="setTab('visual')"
                class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
                class.bind="activeTab === 'visual' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
                Visual
            </button>
            <button click.trigger="setTab('raw')" data-testid="editor-tab-raw"
                class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
                class.bind="activeTab === 'raw' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
                Raw
            </button>
            <span class="ml-auto flex items-baseline gap-1.5 px-3 py-2">
                <span class="text-xs text-gray-500 dark:text-gray-400">${state.eventHandlers.length} entries</span>
                <span class="text-xs text-gray-600 font-mono">myEvents.h</span>
            </span>
        </div>

        <!-- ── Visual tab ─────────────────────────────────────────────────── -->
        <div class="${activeTab === 'visual' ? '' : 'hidden'}" style="flex:1;min-height:0;overflow:hidden;">
            <div id="event-handlers-splitter" style="height:100%;width:100%;">

                <!-- Sidebar -->
                <div class="flex flex-col h-full overflow-hidden border-r border-gray-200 dark:border-white/10 bg-gray-50/60 dark:bg-gray-900/40">
                    <div class="flex flex-col gap-1.5 px-3 py-2.5 border-b border-gray-200 dark:border-white/10">
                        <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Event Handlers</span>
                        <div class="flex items-center gap-1.5">
                            <select value.bind="addSelection" aria-label="Event handler to add"
                                data-testid="add-handler-select"
                                class="flex-1 min-w-0 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2 py-1 text-xs outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
                                <optgroup repeat.for="group of addableGroups" label.bind="group.category">
                                    <option repeat.for="def of group.defs" value.bind="def.id">${def.label}</option>
                                </optgroup>
                            </select>
                            <button click.trigger="addEventHandler()" disabled.bind="addableGroups.length === 0"
                                data-testid="add-handler-button"
                                class="shrink-0 w-6 h-6 rounded bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold text-lg flex items-center justify-center leading-none transition-colors"
                                title="Add event handler">+</button>
                        </div>
                    </div>

                    <nav class="flex flex-col gap-0.5 overflow-y-auto flex-1 p-1.5" aria-label="Event handlers">
                        <a repeat.for="h of state.eventHandlers" click.trigger="selectEntry($index)"
                            class="flex items-center justify-between gap-2 px-2.5 py-2 rounded text-sm cursor-pointer transition-colors"
                            class.bind="selectedIndex === $index
                            ? 'bg-blue-900/60 text-white font-medium'
                            : 'text-gray-700 dark:text-gray-300 hover:bg-gray-900/5 dark:hover:bg-white/5 hover:text-gray-900 dark:hover:text-white'">
                            <span class="flex-1 min-w-0 truncate" title.bind="getDisplayName(h)">${getDisplayName(h)}</span>
                            <button
                                class="shrink-0 w-5 h-5 flex items-center justify-center rounded text-gray-600 hover:bg-red-500/20 hover:text-red-400 transition-colors"
                                click.trigger="removeEventHandler($index, $event)" title="Remove">×</button>
                        </a>
                    </nav>

                    <div if.bind="state.eventHandlers.length === 0" class="flex-1 flex items-center justify-center p-4">
                        <p class="text-gray-600 text-xs text-center">No event handlers.<br>Pick one above and click + to add it.</p>
                    </div>
                </div>

                <!-- Detail panel -->
                <div class="flex flex-col h-full overflow-hidden">
                    <div if.bind="selectedHandler" class="flex flex-col h-full min-h-0">
                        <div class="flex items-center gap-2 px-3 py-2 border-b border-gray-200 dark:border-white/10 shrink-0">
                            <span class="text-sm font-medium text-gray-900 dark:text-gray-100" data-testid="selected-handler-name">${getDisplayName(selectedHandler)}</span>
                        </div>
                        <div class="flex items-center gap-1 px-3 py-2 border-b border-gray-200 dark:border-white/10 shrink-0">
                            <button click.trigger="setRowTab(selectedIndex, 'blocks')" disabled.bind="!canUseBlocks(selectedHandler)"
                                title.bind="canUseBlocks(selectedHandler) ? '' : 'This block can\'t be edited visually yet — switch to Raw.'"
                                data-testid="row-tab-blocks"
                                class="px-2.5 py-1 rounded text-xs font-medium disabled:opacity-40 disabled:cursor-not-allowed"
                                class.bind="selectedTab === 'blocks' ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300'">
                                Blocks
                            </button>
                            <button click.trigger="setRowTab(selectedIndex, 'text')"
                                data-testid="row-tab-raw"
                                class="px-2.5 py-1 rounded text-xs font-medium"
                                class.bind="selectedTab === 'text' ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300'">
                                Raw
                            </button>
                        </div>

                        <div if.bind="selectedTab === 'blocks'" class="flex flex-col flex-1 min-h-0 overflow-hidden">
                            <exrail-block-canvas component.ref="blockCanvas" kind.bind="selectedHandler.command"
                                initial-body.bind="selectedHandler.text" defined.bind="defined"
                                on-full-text-change.bind="makeFullTextChangeHandler(selectedIndex)"></exrail-block-canvas>
                        </div>
                        <!-- Content is seeded via a one-time binding — switchModel() is the sole channel
                             that pushes new content into an already-mounted instance on row change (see
                             sequences-editor.html's identical monaco-editor for the same reasoning). -->
                        <monaco-editor else component.ref="rowRawEditor" value.one-time="rowRawSnapshot"
                            language="cpp" filename.bind="rowRawFilename" data-testid="row-body-monaco"
                            on-text-change.bind="onRowRawChange"></monaco-editor>
                    </div>

                    <div if.bind="!selectedHandler" class="flex-1 flex items-center justify-center text-gray-600 text-sm">
                        <p if.bind="state.eventHandlers.length > 0">Select an event handler to edit its body.</p>
                        <p if.bind="state.eventHandlers.length === 0">No event handlers. Pick one and click + to add it.</p>
                    </div>
                </div>
            </div><!-- end #event-handlers-splitter -->
        </div><!-- end visual tab -->

        <!-- ── Raw tab ────────────────────────────────────────────────────── -->
        <div class="${activeTab === 'raw' ? 'flex flex-col flex-1 min-h-0 overflow-hidden' : 'hidden'}">
            <monaco-editor component.ref="rawEditor" value.to-view="rawSnapshot" language="cpp" filename="myEvents.h"
                data-testid="file-body-monaco" on-text-change.bind="onRawChange"></monaco-editor>
        </div>

    </div>
</template>
