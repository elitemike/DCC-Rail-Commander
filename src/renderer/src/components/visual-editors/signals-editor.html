<template>
    <div class="flex flex-col flex-1 min-h-0 overflow-hidden">

        <div class="flex items-center gap-0 border-b border-gray-200 dark:border-white/10 bg-gray-50/80 dark:bg-gray-900/60 shrink-0 px-2">
            <button click.trigger="setTab('visual')"
                class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
                class.bind="activeTab === 'visual' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
                Visual
            </button>
            <button click.trigger="setTab('raw')"
                class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
                class.bind="activeTab === 'raw' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
                Raw
            </button>
            <span class="ml-auto flex items-baseline gap-1.5 px-3 py-2">
                <span class="text-xs text-gray-500 dark:text-gray-400">${state.signals.length} entries</span>
                <span class="text-xs text-gray-600 font-mono">mySignals.h</span>
            </span>
        </div>

        <div class.bind="activeTab === 'visual' ? 'flex flex-1 min-h-0 overflow-hidden' : 'hidden'"
            style="flex:1;min-height:0;overflow:hidden;">
            <folder-tree-panel items.bind="state.signals" folders.bind="state.signalFolders"
                selected-folder.two-way="selectedFolder" selected-index.two-way="selectedIndex" label="Signals" item-label.bind="itemLabel"
                on-add.bind="addFolder" on-rename.bind="renameFolder" on-remove.bind="removeFolder" on-move.bind="moveToFolder"></folder-tree-panel>
            <div class="flex-1 overflow-y-auto p-4">
                <div class="flex items-center justify-between gap-3 mb-4">
                    <p class="text-xs text-gray-500">Signal heads made up of red/amber/green pins, driven by EX-RAIL.
                    </p>
                    <button click.trigger="addSignal()"
                        class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition-colors">
                        Add Signal
                    </button>
                </div>

                <div if.bind="state.signals.length === 0"
                    class="flex flex-col items-center justify-center gap-3 text-gray-600 py-16">
                    <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9 17.25v1.5m6-1.5v1.5m-9-9V6a3 3 0 013-3h6a3 3 0 013 3v3.75m-15 0v6a3 3 0 003 3h9a3 3 0 003-3v-6m-15 0h15" />
                    </svg>
                    <p class="text-sm">No signals yet. Click "Add Signal" to create one.</p>
                </div>

                <div if.bind="state.signals.length > 0 && selectedIndices.length === 0" data-testid="signal-select-hint" class="text-sm text-gray-500 py-8 text-center">
                    Select a signal in the tree to edit it.
                </div>

                <div if.bind="selectedIndices.length > 0" class="flex flex-col gap-2">
                    <div repeat.for="idx of selectedIndices" data-testid="signal-row"
                        class="flex items-end gap-3 px-4 py-3 bg-gray-100/70 dark:bg-gray-800/50 border border-gray-200 dark:border-white/10 rounded-lg hover:border-gray-300 dark:hover:border-white/20 transition-colors">
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">Kind</label>
                            <select value.bind="state.signals[idx].type" change.trigger="changeSignalType(idx, state.signals[idx].type)"
                                class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
                                <option repeat.for="k of signalKinds" value.bind="k.value">${k.label}</option>
                            </select>
                        </div>
                        <template if.bind="state.signals[idx].type === 'PIN'">
                            <div class="flex flex-col gap-1">
                                <label class="text-[10px] font-semibold text-red-400 uppercase tracking-wide">Red</label>
                                <vpin-picker value.two-way="state.signals[idx].red" on-commit.bind="makeSignalCommitHandler(idx)"></vpin-picker>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[10px] font-semibold text-amber-400 uppercase tracking-wide">Amber</label>
                                <vpin-picker value.two-way="state.signals[idx].amber" on-commit.bind="makeSignalCommitHandler(idx)"></vpin-picker>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[10px] font-semibold text-green-400 uppercase tracking-wide">Green</label>
                                <vpin-picker value.two-way="state.signals[idx].green" on-commit.bind="makeSignalCommitHandler(idx)"></vpin-picker>
                            </div>
                        </template>
                        <template if.bind="state.signals[idx].type === 'DCC'">
                            <div class="flex flex-col gap-1">
                                <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">ID</label>
                                <input type="number" value.bind="state.signals[idx].id" blur.trigger="updateSignal(idx, state.signals[idx])"
                                    class="w-20 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">Address</label>
                                <input type="number" value.bind="state.signals[idx].addr" blur.trigger="updateSignal(idx, state.signals[idx])"
                                    class="w-20 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">Sub-Address</label>
                                <input type="number" value.bind="state.signals[idx].subAddr" blur.trigger="updateSignal(idx, state.signals[idx])"
                                    class="w-20 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                            </div>
                        </template>
                        <div class="flex flex-col gap-1 flex-1">
                            <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">Description</label>
                            <input type="text" value.two-way="state.signals[idx].description" blur.trigger="updateSignal(idx, state.signals[idx])" placeholder="Description"
                                class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm placeholder-gray-400 dark:placeholder-gray-600 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                        </div>
                        <div if.bind="folderPaths.length > 0" class="flex flex-col gap-1">
                            <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">Folder</label>
                            <select data-testid="signal-folder" value.bind="state.signals[idx].folder || ''" change.trigger="moveToFolder(idx, $event.target.value)"
                                class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2 py-1.5 text-sm outline-none focus:border-blue-500">
                                <option value="">(none)</option>
                                <option repeat.for="f of folderPaths" value.bind="f">${f}</option>
                            </select>
                        </div>
                        <button click.trigger="removeSignal(idx)" title="Remove signal"
                            class="w-7 h-7 flex items-center justify-center rounded-md bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-gray-900 dark:hover:text-white text-base font-bold transition-colors shrink-0">×</button>
                    </div>
                </div>
            </div>
        </div>

        <div class.bind="activeTab === 'raw' ? 'flex flex-col flex-1 min-h-0 overflow-hidden' : 'hidden'">
            <monaco-editor component.ref="rawEditor" value.to-view="rawSnapshot" language="cpp" filename="mySignals.h"
                on-text-change.bind="onRawChange"></monaco-editor>
        </div>

    </div>
</template>
