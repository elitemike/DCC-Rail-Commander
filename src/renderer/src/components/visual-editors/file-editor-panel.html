        <div if.bind="currentView === 'automation'" class="flex flex-col flex-1 overflow-hidden">

        <!-- myStartup.h → startup-editor (Visual TrackManager + Turnout Defaults / Raw) -->
        <div if.bind="currentView === 'startup'" class="flex flex-col flex-1 overflow-hidden">

        <div if.bind="currentView === 'sequences'" class="flex flex-col flex-1 overflow-hidden">
