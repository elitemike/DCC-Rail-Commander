<template>
    <div class="flex flex-col flex-1 min-h-0 h-full">
        <div if.bind="parseError" class="px-3 py-2 text-xs bg-amber-500/10 text-amber-600 dark:text-amber-400 border-b border-amber-500/20">
            Couldn't load this body into Blocks mode: ${parseError}
        </div>
        <div if.bind="canvasWarning" class="px-3 py-2 text-xs bg-amber-500/10 text-amber-600 dark:text-amber-400 border-b border-amber-500/20">
            ${canvasWarning}
        </div>
        <div class="flex flex-1 min-h-0 overflow-hidden">
            <div id.bind="paletteElId" class="w-52 shrink-0 border-r border-gray-200 dark:border-white/10 overflow-y-auto"></div>
            <div class="flex-1 relative min-h-0 overflow-hidden">
                <div id.bind="diagramElId" class="w-full h-full"></div>
            </div>
            <div if.bind="selectedNode" class="w-56 shrink-0 border-l border-gray-200 dark:border-white/10 p-3 overflow-y-auto">
                <p class="text-xs font-semibold text-gray-700 dark:text-gray-200 mb-2">${selectedNode.def.label}</p>
                <div repeat.for="p of selectedNode.def.params" class="mb-2">
                    <label class="block text-[11px] text-gray-500 dark:text-gray-400 mb-1">${p.label}</label>
                    <input type="text" value.bind="selectedNode.info.paramValues[p.name]"
                        change.trigger="updateParam(p.name, $event.target.value)"
                        class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2 py-1 text-xs outline-none focus:border-blue-500" />
                </div>
            </div>
        </div>
    </div>
</template>
