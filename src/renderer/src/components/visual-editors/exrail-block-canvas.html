<template>
    <div class="flex flex-col flex-1 min-h-0 h-full">
        <div if.bind="parseError" class="px-3 py-2 text-xs bg-amber-500/10 text-amber-600 dark:text-amber-400 border-b border-amber-500/20">
            Couldn't load this body into Blocks mode: ${parseError}
        </div>
        <!-- Syncfusion Splitter: pane 1 is the palette+canvas row (unchanged from before), pane 2 is
             an always-visible readonly pane showing the same compiled EXRAIL text onBodyChange sends
             to the host editor — kept current by exrail-block-canvas.ts's _refreshOutput(), which
             runs on every load and every structural workspace change. Built/destroyed in
             attached()/detaching() like every other Splitter instance in this codebase (see
             routes-editor.ts), not via if.bind, so resizing it doesn't fight Aurelia's rendering. -->
        <!-- Splitter's appendTo() wholesale-replaces each DIRECT child's class attribute with its own
             e-pane/display:block classes (see routes-editor.html's Sidebar/Detail pane comments for
             the same behavior) — so the flex row/column layout each pane needs for its own content
             must live one level deeper, on a grandchild Splitter never touches, not on the pane div
             itself. Each pane div below is otherwise class-less for that reason; only h-full (a
             percentage, not a flex-item property) would have survived on the pane itself, and even
             that's redundant once Splitter is managing the pane's own pixel height directly. -->
        <div id="exrail-output-splitter" class="flex-1 min-h-0" style="width:100%;height:100%;">
            <div>
                <div class="flex h-full min-h-0 overflow-hidden">
                    <nav class="w-44 shrink-0 overflow-y-auto border-r border-gray-200 dark:border-white/10 py-1.5 flex flex-col">
                        <template repeat.for="node of paletteTree">
                            <button type="button" click.trigger="onCategoryClick(node)"
                                class="flex items-center gap-2 px-2.5 py-1.5 text-xs font-medium text-left transition-colors"
                                class.bind="node.path === selectedLeafPath
                                    ? 'bg-blue-600 text-white'
                                    : 'text-gray-700 dark:text-gray-200 hover:bg-gray-900/5 dark:hover:bg-white/5'">
                                <span class="w-2 h-2 rounded-sm shrink-0" style.bind="'background-color:' + node.colour"></span>
                                <span class="flex-1">${node.name}</span>
                                <span if.bind="node.children.length > 0" class="text-[10px] opacity-70">${node.expanded ? '▾' : '▸'}</span>
                            </button>
                            <template if.bind="node.children.length > 0 && node.expanded">
                                <button repeat.for="child of node.children" type="button" click.trigger="onCategoryClick(child)"
                                    class="flex items-center gap-2 pl-6 pr-2.5 py-1.5 text-xs font-medium text-left transition-colors"
                                    class.bind="child.path === selectedLeafPath
                                        ? 'bg-blue-600 text-white'
                                        : 'text-gray-700 dark:text-gray-200 hover:bg-gray-900/5 dark:hover:bg-white/5'">
                                    <span class="w-2 h-2 rounded-sm shrink-0" style.bind="'background-color:' + child.colour"></span>
                                    <span class="flex-1">${child.name}</span>
                                </button>
                            </template>
                        </template>
                    </nav>
                    <div class="flex-1 relative min-h-0 overflow-hidden" data-testid="canvas-viewport">
                        <div ref="container" class="absolute inset-0"></div>
                    </div>
                </div>
            </div>
            <div>
                <div class="flex flex-col h-full min-h-0 overflow-hidden bg-gray-50/60 dark:bg-gray-900/40" data-testid="exrail-output-pane">
                    <div class="px-2.5 py-1.5 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider border-b border-gray-200 dark:border-white/10 shrink-0">
                        Output
                    </div>
                    <pre class="flex-1 min-h-0 overflow-auto m-0 p-2.5 text-xs font-mono whitespace-pre-wrap wrap-break-word text-gray-800 dark:text-gray-200"
                        data-testid="exrail-output-text">${outputText}</pre>
                </div>
            </div>
        </div>
    </div>
</template>
