<template>
    <div class="flex flex-col flex-1 min-h-0 overflow-hidden">

        <div class="flex items-center gap-0 border-b border-gray-200 dark:border-white/10 bg-gray-50/80 dark:bg-gray-900/60 shrink-0 px-2">
            <button click.trigger="setTab('visual')"
                class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
                class.bind="activeTab === 'visual' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
                Visual
            </button>
            <button click.trigger="setTab('raw')"
                class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
                class.bind="activeTab === 'raw' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
                Raw
            </button>
            <span class="ml-auto flex items-baseline gap-1.5 px-3 py-2">
                <span class="text-xs text-gray-500 dark:text-gray-400">${state.sensors.length} entries</span>
                <span class="text-xs text-gray-600 font-mono">mySensors.h</span>
            </span>
        </div>

        <div class.bind="activeTab === 'visual' ? 'flex flex-1 min-h-0 overflow-hidden' : 'hidden'"
            style="flex:1;min-height:0;overflow:hidden;">
            <div class="flex-1 overflow-y-auto p-4">
                <div class="flex items-center justify-between gap-3 mb-4">
                    <p class="text-xs text-gray-500">Digital or analog sensors that EX-RAIL and JMRI can read the
                        state of.</p>
                    <button click.trigger="addSensor()"
                        class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition-colors">
                        Add Sensor
                    </button>
                </div>

                <div if.bind="state.sensors.length === 0"
                    class="flex flex-col items-center justify-center gap-3 text-gray-600 py-16">
                    <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                    </svg>
                    <p class="text-sm">No sensors yet. Click "Add Sensor" to create one.</p>
                </div>

                <div if.bind="state.sensors.length > 0" class="flex flex-col gap-2">
                    <div repeat.for="s of state.sensors"
                        class="flex items-end gap-3 px-4 py-3 bg-gray-100/70 dark:bg-gray-800/50 border border-gray-200 dark:border-white/10 rounded-lg hover:border-gray-300 dark:hover:border-white/20 transition-colors">
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">ID</label>
                            <input type="number" value.two-way="s.id" blur.trigger="updateSensor($index, s)"
                                class="w-20 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">Pin</label>
                            <vpin-picker value.two-way="s.pin" on-commit.bind="makeSensorCommitHandler($index)"></vpin-picker>
                        </div>
                        <div class="flex flex-col gap-1 flex-1">
                            <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">Description</label>
                            <input type="text" value.two-way="s.description" blur.trigger="updateSensor($index, s)" placeholder="Description"
                                class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm placeholder-gray-400 dark:placeholder-gray-600 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                        </div>
                        <button click.trigger="removeSensor($index)" title="Remove sensor"
                            class="w-7 h-7 flex items-center justify-center rounded-md bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-gray-900 dark:hover:text-white text-base font-bold transition-colors shrink-0">×</button>
                    </div>
                </div>
            </div>
        </div>

        <div class.bind="activeTab === 'raw' ? 'flex flex-col flex-1 min-h-0 overflow-hidden' : 'hidden'">
            <monaco-editor component.ref="rawEditor" value.to-view="rawSnapshot" language="cpp" filename="mySensors.h"
                on-text-change.bind="onRawChange"></monaco-editor>
        </div>

    </div>
</template>
