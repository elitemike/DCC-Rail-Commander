<template>
    <div class="flex-1 overflow-y-auto p-4">
        <div if.bind="throttleService.routeStatuses.length === 0" class="text-gray-500 text-sm text-center py-12">
            No routes configured.
        </div>
        <div if.bind="throttleService.routeStatuses.length > 0" class="flex flex-col gap-2">
            <div repeat.for="entry of throttleService.routeStatuses" data-testid="route-row"
                data-route-id.bind="entry.id"
                class="flex items-center gap-3 px-4 py-3 rounded-lg bg-gray-900/5 dark:bg-white/5 border border-gray-200 dark:border-white/10">
                <span class="flex-1 min-w-0">
                    <span class="block text-sm font-medium text-gray-900 dark:text-gray-100 truncate">${routeFor(entry.id).description}</span>
                    <span class="block text-xs text-gray-500">#${entry.id}</span>
                </span>
                <span data-testid="route-status-badge" data-status.bind="entry.status"
                    class="px-2.5 py-1 rounded text-xs font-semibold shrink-0"
                    class.bind="entry.status === 'MATCHED'
                        ? 'bg-green-100 dark:bg-green-700/60 text-green-800 dark:text-green-200 border border-green-400 dark:border-green-500/50'
                        : 'bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300 border border-red-400 dark:border-red-500/40'">
                    ${entry.status === 'MATCHED' ? 'Active' : 'Inactive'}
                </span>
                <button type="button" click.trigger="throttleService.triggerRoute(entry.id)"
                    data-testid="route-trigger-button"
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-gray-200 dark:border-white/10 bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 text-gray-700 dark:text-gray-200 transition-colors shrink-0 focus:outline-none">
                    Trigger
                </button>
            </div>
        </div>
    </div>
</template>
