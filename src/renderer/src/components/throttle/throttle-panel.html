<div class="flex flex-col flex-1 overflow-hidden" data-testid="throttle-panel-root"
    class.bind="isFullscreen ? 'fixed inset-0 z-50 bg-white dark:bg-gray-950' : ''">

    <!-- Header: track power + e-stop -->
    <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200 dark:border-white/10 shrink-0 flex-wrap">
        <button click.trigger="togglePower()" data-testid="throttle-power-toggle"
            title.bind="throttleService.trackPower === true ? 'Turn track power off' : 'Turn track power on'"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition-colors"
            class.bind="throttleService.trackPower === true
                ? 'bg-green-700/40 hover:bg-green-700/60 border-green-500/50 text-green-300'
                : throttleService.trackPower === false
                    ? 'bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 border-gray-200 dark:border-white/10 text-gray-700 dark:text-gray-300'
                    : 'bg-gray-900/5 dark:bg-white/5 border-gray-200 dark:border-white/10 text-gray-500'">
            <span class="w-1.5 h-1.5 rounded-full shrink-0"
                class.bind="throttleService.trackPower === true ? 'bg-emerald-400'
                    : throttleService.trackPower === false ? 'bg-red-400'
                    : 'bg-gray-500 animate-pulse'"></span>
            ${throttleService.trackPower === true ? 'Track Power: ON'
                : throttleService.trackPower === false ? 'Track Power: OFF'
                : 'Track Power: —'}
        </button>

        <div class="flex-1"></div>

        <button click.trigger="toggleFullscreen()" data-testid="throttle-fullscreen-toggle"
            title.bind="isFullscreen ? 'Exit full screen' : 'Full screen — show all throttles'"
            class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 border border-gray-200 dark:border-white/10 text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-colors">
            <svg if.bind="!isFullscreen" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 8V4h4M20 8V4h-4M4 16v4h4m8 0h4v-4" />
            </svg>
            <svg if.bind="isFullscreen" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 4H5v4M15 4h4v4M9 20H5v-4M15 20h4v-4" />
            </svg>
        </button>

        <button dblclick.trigger="emergencyStopAll()"
            title="Double-click to emergency stop every loco on the track" data-testid="throttle-estop-all"
            class="px-4 py-1.5 rounded-lg text-xs font-bold bg-red-700/70 hover:bg-red-600 text-red-100 transition-colors">⛔
            E-Stop All (double-click)</button>
    </div>

    <!-- Tab strip: Throttles | Turnouts/Routes -->
    <div class="flex items-center gap-0 border-b border-gray-200 dark:border-white/10 bg-gray-50/80 dark:bg-gray-900/60 shrink-0 px-2">
        <button click.trigger="setTab('throttles')" data-testid="throttle-tab-throttles"
            class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
            class.bind="activeTab === 'throttles' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
            Throttles
        </button>
        <button click.trigger="setTab('turnoutsRoutes')" data-testid="throttle-tab-turnouts-routes"
            class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
            class.bind="activeTab === 'turnoutsRoutes' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
            Turnouts/Routes
        </button>
    </div>

    <!-- ── Throttles tab ──────────────────────────────────────────────── -->
    <template if.bind="activeTab === 'throttles'">
        <!-- Add throttle -->
        <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200 dark:border-white/10 shrink-0 flex-wrap">
            <span class="text-xs text-gray-500 uppercase tracking-wide font-semibold">Add Throttle</span>

            <div class="w-32"><input ref="addModeEl" type="text" data-testid="throttle-add-mode" /></div>

            <div class="w-56" class.bind="addMode === 'roster' ? '' : 'hidden'">
                <input ref="rosterDropdownEl" type="text" data-testid="throttle-roster-select" />
            </div>
            <div class="w-24" class.bind="addMode === 'address' ? '' : 'hidden'">
                <input ref="freeformAddressEl" type="text" data-testid="throttle-address-input" />
            </div>

            <button click.trigger="addSelected()"
                disabled.bind="addMode === 'roster' && selectedRosterAddress == null" data-testid="throttle-add"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:text-gray-500 text-white transition-colors">Add</button>
        </div>

        <!-- Throttle grid -->
        <div class="flex-1 overflow-y-auto p-4">
            <div if.bind="throttleService.throttles.length === 0" class="text-gray-500 text-sm text-center py-12">
                No throttles yet — add a loco from the roster or by DCC address above.
            </div>
            <div if.bind="throttleService.throttles.length > 0" class="grid gap-5"
                style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
                <throttle-card repeat.for="t of throttleService.throttles" cab.bind="t" data-testid="throttle-card"
                    roster-functions.bind="rosterFunctionsFor(t.cab)"
                    is-roster-match.bind="isRosterLoco(t.cab)"></throttle-card>
            </div>
        </div>
    </template>

    <!-- ── Turnouts/Routes tab: routes on top, turnouts below ─────────── -->
    <div if.bind="activeTab === 'turnoutsRoutes'" class="flex flex-col flex-1 min-h-0 overflow-y-auto">
        <h3 data-testid="routes-section-label"
            class="px-4 pt-4 pb-1 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Routes</h3>
        <routes-view></routes-view>
        <h3 data-testid="turnouts-section-label"
            class="px-4 pt-2 pb-1 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Turnouts</h3>
        <turnouts-view></turnouts-view>
    </div>

</div>
