<template>
    <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-white/10 w-full max-w-6xl h-[80vh] shadow-2xl flex flex-col">

            <!-- Header -->
            <div class="px-6 pt-6 pb-4 border-b border-gray-200 dark:border-white/10 flex items-start justify-between shrink-0">
                <div>
                    <h2 class="text-gray-900 dark:text-white text-lg font-semibold">Changes</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                        ${files.length} file${files.length === 1 ? '' : 's'} will change when you save.
                    </p>
                </div>
                <button click.trigger="close()" data-testid="file-changes-dialog-close-x" disabled.bind="saving"
                    class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-900/10 dark:hover:bg-white/10 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    aria-label="Close">
                    ✕
                </button>
            </div>

            <!-- Empty state: nothing to preview -->
            <div if.bind="files.length === 0" class="flex-1 flex items-center justify-center text-sm text-gray-500 dark:text-gray-400" data-testid="file-changes-empty">
                No changes to preview — every file already matches what's on disk.
            </div>

            <!-- Body: file list + diff editor -->
            <div if.bind="files.length > 0" class="flex flex-1 min-h-0">
                <aside class="w-64 shrink-0 border-r border-gray-200 dark:border-white/10 overflow-y-auto py-2" data-testid="file-changes-list">
                    <div repeat.for="f of files" click.trigger="selectFile($index)" data-testid="file-change-row" data-file="${f.name}"
                        class="flex items-center gap-2 px-4 py-2 cursor-pointer text-sm border-l-2 ${$index === selectedIndex
                            ? 'border-l-blue-500 bg-blue-50 dark:bg-blue-950/40 text-gray-900 dark:text-white'
                            : 'border-l-transparent text-gray-600 dark:text-gray-400 hover:bg-gray-900/5 dark:hover:bg-white/5'}">
                        <span data-testid="file-change-status-${f.status}"
                            class="w-1.5 h-1.5 rounded-full shrink-0 ${f.status === 'changed' ? 'bg-blue-500' : f.status === 'new' ? 'bg-emerald-500' : 'bg-gray-400 dark:bg-gray-600'}">
                        </span>
                        <span class="truncate font-mono text-xs">${f.name}</span>
                    </div>
                </aside>

                <div class="flex-1 min-w-0 relative">
                    <div ref="container" class="absolute inset-0" data-testid="file-changes-diff-editor"></div>
                </div>
            </div>

            <!-- Footer -->
            <div class="flex justify-end gap-2 px-6 py-4 border-t border-gray-200 dark:border-white/10 shrink-0">
                <button click.trigger="close()" data-testid="file-changes-close-button" disabled.bind="saving"
                    class="px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Close
                </button>
                <button click.trigger="save()" data-testid="file-changes-save-button" disabled.bind="saving"
                    class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    ${saving ? 'Saving…' : 'Save'}
                </button>
            </div>
        </div>
    </div>
</template>
