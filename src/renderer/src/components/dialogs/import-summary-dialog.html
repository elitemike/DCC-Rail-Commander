<template>
    <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-white/10 w-full max-w-5xl h-[80vh] shadow-2xl flex flex-col">

            <!-- Header -->
            <div class="px-6 pt-6 pb-4 border-b border-gray-200 dark:border-white/10 flex items-start justify-between shrink-0">
                <div>
                    <h2 class="text-gray-900 dark:text-white text-lg font-semibold">Import Summary</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                        ${result.fileReports.length} old file${result.fileReports.length === 1 ? '' : 's'} scanned —
                        ${outputFileCount} file${outputFileCount === 1 ? '' : 's'} will be created in the new project.
                    </p>
                </div>
                <button click.trigger="cancel()" data-testid="import-summary-close-x"
                    class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-900/10 dark:hover:bg-white/10 transition-colors"
                    aria-label="Close">
                    ✕
                </button>
            </div>

            <!-- Tab strip -->
            <div class="flex items-center gap-0 border-b border-gray-200 dark:border-white/10 bg-gray-50/80 dark:bg-gray-900/60 shrink-0 px-2">
                <button click.trigger="setTab('files')" data-testid="import-summary-tab-files"
                    class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
                    class.bind="tab === 'files' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
                    Files
                </button>
                <button click.trigger="setTab('aliases')" data-testid="import-summary-tab-aliases"
                    class="px-4 py-2.5 text-sm font-medium border-b-2 transition-all focus:outline-none"
                    class.bind="tab === 'aliases' ? 'border-blue-500 text-gray-900 dark:text-white' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
                    Aliases to Review
                    <span if.bind="result.aliasReview.length > 0"
                        class="ml-1.5 inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1 rounded-full bg-amber-500 text-white text-xs font-semibold">${result.aliasReview.length}</span>
                </button>
            </div>

            <!-- ── Files tab ──────────────────────────────────────────────────── -->
            <div if.bind="tab === 'files'" class="flex flex-1 min-h-0">
                <aside class="w-72 shrink-0 border-r border-gray-200 dark:border-white/10 overflow-y-auto py-2" data-testid="import-summary-file-list">
                    <div repeat.for="r of result.fileReports" click.trigger="selectFile($index)" data-testid="import-summary-file-row"
                        class="flex items-center gap-2 px-4 py-2 cursor-pointer text-sm border-l-2 ${$index === selectedIndex
                            ? 'border-l-blue-500 bg-blue-50 dark:bg-blue-950/40 text-gray-900 dark:text-white'
                            : 'border-l-transparent text-gray-600 dark:text-gray-400 hover:bg-gray-900/5 dark:hover:bg-white/5'}">
                        <span class="w-1.5 h-1.5 rounded-full shrink-0 ${statusDot[r.status]}"></span>
                        <span class="truncate font-mono text-xs">${r.originalName}</span>
                    </div>
                </aside>

                <div class="flex-1 min-w-0 overflow-y-auto p-4" data-testid="import-summary-file-detail">
                    <template if.bind="selectedReport">
                        <p class="text-sm font-medium text-gray-900 dark:text-white mb-1">${selectedReport.originalName}</p>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">${statusLabel[selectedReport.status]}</p>
                        <template if.bind="selectedReport.leftoverFileName">
                            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1.5">
                                Leftover content → ${selectedReport.leftoverFileName}
                            </p>
                            <pre class="text-xs font-mono bg-gray-100 dark:bg-gray-800/60 border border-gray-200 dark:border-white/10 rounded-lg p-3 overflow-auto whitespace-pre-wrap">${selectedLeftoverContent}</pre>
                        </template>
                    </template>
                </div>
            </div>

            <!-- ── Aliases tab ────────────────────────────────────────────────── -->
            <div if.bind="tab === 'aliases'" class="flex-1 overflow-y-auto p-4">
                <div if.bind="result.aliasReview.length === 0" class="flex-1 flex items-center justify-center text-sm text-gray-500 dark:text-gray-400 py-16 text-center">
                    Every alias was classified with confidence — nothing needs manual review.
                </div>
                <div if.bind="result.aliasReview.length > 0" class="flex flex-col gap-2">
                    <div repeat.for="item of result.aliasReview" data-testid="import-summary-alias-row"
                        class="px-4 py-3 bg-gray-100/70 dark:bg-gray-800/50 border border-gray-200 dark:border-white/10 rounded-lg">
                        <div class="flex items-baseline justify-between gap-2 mb-1">
                            <span class="font-mono text-sm text-gray-900 dark:text-white">${item.name}</span>
                            <span if.bind="item.suggestedType" class="text-xs text-gray-500 dark:text-gray-400">best guess: ${item.suggestedType}</span>
                        </div>
                        <p class="text-sm text-gray-700 dark:text-gray-300 mb-1">${item.reason}</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Value(s): ${formatValues(item)}</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Used as: ${formatRoles(item)}</p>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="flex justify-end gap-2 px-6 py-4 border-t border-gray-200 dark:border-white/10 shrink-0">
                <button click.trigger="cancel()" data-testid="import-summary-cancel-button"
                    class="px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 rounded-lg transition-colors">
                    Cancel
                </button>
                <button click.trigger="continue()" data-testid="import-summary-continue-button"
                    class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors">
                    Continue — Choose Destination Folder
                </button>
            </div>
        </div>
    </div>
</template>
