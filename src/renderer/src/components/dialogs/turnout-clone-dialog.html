<template>
    <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 rounded-xl shadow-2xl max-w-md w-full mx-4"
            data-testid="turnout-clone-dialog">
            <div class="p-5 flex flex-col gap-4">
                <div class="flex flex-col gap-1">
                    <h2 class="text-base font-semibold text-gray-900 dark:text-white">Clone Turnout</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400">Creates a second turnout on the same pin/address.</p>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="turnout-clone-id" class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">ID</label>
                    <input id="turnout-clone-id" type="number" min="0" value.bind="id" input.trigger="clearError()"
                        class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm w-28 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                    <p if.bind="errorMessage" data-testid="turnout-clone-error" class="text-xs text-red-500">${errorMessage}</p>
                </div>

                <div if.bind="isServo" class="flex flex-col gap-1.5">
                    <label for="turnout-clone-profile" class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Profile (speed)</label>
                    <select id="turnout-clone-profile" value.bind="profile"
                        class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
                        <option repeat.for="p of profiles" value.bind="p">${p}</option>
                    </select>
                </div>

                <label class="flex items-center gap-2 text-sm text-gray-900 dark:text-gray-100 cursor-pointer">
                    <input type="checkbox" checked.bind="hidden" />
                    Hidden from throttles
                </label>
            </div>
            <div class="flex justify-end gap-2 px-5 py-4 border-t border-gray-200 dark:border-white/10">
                <button click.trigger="cancel()"
                    class="px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 rounded-lg transition-colors">
                    Cancel
                </button>
                <button click.trigger="ok()"
                    class="px-4 py-2 text-sm font-medium text-white rounded-lg transition-colors bg-blue-600 hover:bg-blue-500">
                    Clone
                </button>
            </div>
        </div>
    </div>
</template>
