<template>
    <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 rounded-xl shadow-2xl max-w-md w-full mx-4"
            data-testid="new-item-dialog">

            <!-- Step 1: what to create -->
            <div if.bind="step === 'select'">
                <div class="p-5 flex flex-col gap-3">
                    <h2 class="text-base font-semibold text-gray-900 dark:text-white">Create New</h2>
                    <button repeat.for="c of choices" type="button" click.trigger="choose(c)"
                        disabled.bind="disabledReason(c)" data-testid="new-item-choice-${c.id}"
                        class="text-left border border-gray-300 dark:border-white/15 rounded-lg px-3 py-2.5 transition-colors hover:bg-gray-900/5 dark:hover:bg-white/5 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-transparent">
                        <div class="text-sm font-medium text-gray-900 dark:text-white">${c.title}</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">${c.description}</div>
                        <div if.bind="disabledReason(c)" class="text-xs text-amber-500 mt-1">${disabledReason(c)}</div>
                    </button>
                </div>
                <div class="flex justify-end gap-2 px-5 py-4 border-t border-gray-200 dark:border-white/10">
                    <button click.trigger="cancel()"
                        class="px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 rounded-lg transition-colors">
                        Cancel
                    </button>
                </div>
            </div>

            <!-- Step 2: multi-turnout crossover -->
            <div if.bind="step === 'crossover'">
                <div class="p-5 flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <h2 class="text-base font-semibold text-gray-900 dark:text-white">Multi-turnout crossover</h2>
                        <p class="text-xs text-gray-500 dark:text-gray-400">
                            Creates one virtual turnout. Throwing or closing it throws or closes every turnout selected below.
                        </p>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">
                            Turnouts to combine (${selectedIds.length} selected, min ${minMembers})
                        </span>
                        <div class="max-h-48 overflow-y-auto border border-gray-300 dark:border-white/15 rounded-md divide-y divide-gray-200 dark:divide-white/10">
                            <label repeat.for="t of state.turnouts"
                                class="flex items-center gap-2 px-2.5 py-1.5 text-sm text-gray-900 dark:text-gray-100 cursor-pointer hover:bg-gray-900/5 dark:hover:bg-white/5">
                                <input type="checkbox" model.bind="t.id" checked.bind="selectedIds" input.trigger="clearError()"
                                    data-testid="crossover-member-${t.id}" />
                                <span class="font-mono text-xs text-gray-500 dark:text-gray-400 w-8">${t.id}</span>
                                <span class="flex-1 truncate">${t.description === 'HIDDEN' ? '(hidden)' : t.description}</span>
                                <span if.bind="turnoutAlias(t.id)" class="text-xs text-gray-500 dark:text-gray-400">${turnoutAlias(t.id)}</span>
                            </label>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <div class="flex flex-col gap-1.5 w-24">
                            <label for="crossover-id" class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">ID</label>
                            <input id="crossover-id" type="number" min="0" value.bind="masterId" input.trigger="clearError()"
                                data-testid="crossover-id"
                                class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm w-full outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                        </div>
                        <div class="flex flex-col gap-1.5 flex-1">
                            <label for="crossover-name" class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Name</label>
                            <input id="crossover-name" type="text" value.bind="masterName" placeholder="e.g. Yard crossover"
                                data-testid="crossover-name"
                                class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm w-full outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                        </div>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="crossover-alias" class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">
                            Alias${state.strictAliases ? ' (required)' : ''}
                        </label>
                        <input id="crossover-alias" type="text" value.bind="masterAlias" input.trigger="clearError()"
                            placeholder="e.g. YARD_CROSSOVER" data-testid="crossover-alias"
                            class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm w-full outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                    </div>

                    <label class="flex items-start gap-2 text-sm text-gray-900 dark:text-gray-100 cursor-pointer">
                        <input type="checkbox" checked.bind="hideMembers" class="mt-0.5" data-testid="crossover-hide-members" />
                        <span>
                            Hide the individual turnouts from throttles
                            <span class="block text-xs text-gray-500 dark:text-gray-400">Marks each selected turnout HIDDEN so only the combined control shows.</span>
                        </span>
                    </label>

                    <p if.bind="errorMessage" data-testid="crossover-error" class="text-xs text-red-500">${errorMessage}</p>
                </div>
                <div class="flex justify-between gap-2 px-5 py-4 border-t border-gray-200 dark:border-white/10">
                    <button click.trigger="back()"
                        class="px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 rounded-lg transition-colors">
                        Back
                    </button>
                    <div class="flex gap-2">
                        <button click.trigger="cancel()"
                            class="px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 rounded-lg transition-colors">
                            Cancel
                        </button>
                        <button click.trigger="create()" disabled.bind="!canCreate" data-testid="crossover-create"
                            class="px-4 py-2 text-sm font-medium text-white rounded-lg transition-colors bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                            Create
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
