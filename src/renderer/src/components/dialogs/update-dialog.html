<template>
    <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div data-testid="update-dialog"
            class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-white/10 w-full max-w-2xl shadow-2xl flex flex-col max-h-[85vh]">

            <!-- Header -->
            <div class="flex items-start justify-between gap-3 px-6 pt-6 pb-4 border-b border-gray-200 dark:border-white/10">
                <div class="min-w-0">
                    <h2 class="text-gray-900 dark:text-white text-lg font-semibold" data-testid="update-dialog-title">${title}</h2>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1" data-testid="update-dialog-versions">
                        Version <span class="font-semibold text-gray-900 dark:text-white">${version}</span>
                        <span if.bind="releaseDate">(released ${releaseDate})</span>
                        — you have ${updater.appVersion}.
                    </p>
                </div>
                <button click.trigger="later()" title="Close" aria-label="Close"
                    class="shrink-0 w-8 h-8 flex items-center justify-center rounded-lg text-gray-500 hover:text-gray-900 dark:hover:text-white hover:bg-gray-900/10 dark:hover:bg-white/10 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Release notes -->
            <div class="px-6 py-4 overflow-y-auto min-h-0 flex-1">
                <div class="flex items-baseline justify-between gap-3 mb-2">
                    <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">What's new</h3>
                    <a href.bind="releaseUrl" target="_blank" rel="noopener noreferrer"
                        class="text-xs text-blue-600 dark:text-blue-400 hover:underline">View on GitHub</a>
                </div>
                <div ref="notesEl" data-testid="update-release-notes" class="space-y-5"></div>
            </div>

            <!-- Status -->
            <div if.bind="status === 'downloading'" class="px-6 pt-3">
                <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400 mb-1">
                    <span>Downloading…</span>
                    <span data-testid="update-download-percent">${percent}%</span>
                </div>
                <div class="h-2 rounded-full bg-gray-200 dark:bg-white/10 overflow-hidden">
                    <div class="h-full bg-blue-600 transition-[width] duration-200" css="width: ${percent}%"></div>
                </div>
            </div>
            <p if.bind="status === 'downloaded'" class="px-6 pt-3 text-sm text-gray-600 dark:text-gray-300">
                The update is downloaded. The app will restart to finish installing — or it installs automatically the
                next time you quit.
            </p>
            <p if.bind="errorMessage" data-testid="update-error"
                class="mx-6 mt-3 px-3 py-2 rounded-lg text-sm bg-red-50 dark:bg-red-500/10 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-500/20">
                Update failed: ${errorMessage}
            </p>

            <!-- Footer -->
            <div class="flex items-center justify-between gap-2 px-6 py-4 mt-3 border-t border-gray-200 dark:border-white/10">
                <div>
                    <button if.bind="status === 'available'" click.trigger="skip()" data-testid="update-skip"
                        class="px-3 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">
                        Skip this version
                    </button>
                </div>
                <div class="flex gap-2">
                    <button click.trigger="later()" data-testid="update-later"
                        class="px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 rounded-lg transition-colors">
                        Later
                    </button>
                    <button if.bind="canDownload" click.trigger="download()"
                        data-testid="update-download"
                        class="px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 hover:bg-blue-500 text-white transition-colors">
                        ${status === 'error' ? 'Try again' : 'Download update'}
                    </button>
                    <button if.bind="status === 'downloaded'" click.trigger="install()" data-testid="update-install"
                        class="px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 hover:bg-blue-500 text-white transition-colors">
                        Restart &amp; install
                    </button>
                </div>
            </div>

        </div>
    </div>
</template>
