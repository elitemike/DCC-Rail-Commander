<template>
    <div data-testid="folder-tree-panel"
        class="flex flex-col h-full w-56 shrink-0 border-r border-gray-200 dark:border-white/10 bg-gray-50/60 dark:bg-gray-900/40">
        <div class="flex items-center justify-between gap-1 px-3 py-2 border-b border-gray-200 dark:border-white/10">
            <span class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">Folders</span>
            <span class="flex items-center gap-1">
                <button if.bind="selected" click.trigger="promptRename()" data-testid="rename-folder" title="Rename folder"
                    class="px-1.5 py-0.5 text-xs rounded text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Rename</button>
                <button if.bind="selected" click.trigger="confirmDelete()" data-testid="delete-folder" title="Delete folder"
                    class="px-1.5 py-0.5 text-xs rounded text-red-500 hover:bg-red-500/10 transition-colors">Delete</button>
                <button click.trigger="promptNewFolder()" data-testid="new-folder" title="New folder"
                    class="w-6 h-6 flex items-center justify-center rounded text-base font-bold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">+</button>
            </span>
        </div>
        <div class="flex-1 overflow-y-auto py-1" role="tree">
            <button click.trigger="select('')" data-testid="folder-all" role="treeitem"
                class="w-full flex items-center justify-between gap-2 px-3 py-1.5 text-sm text-left transition-colors"
                class.bind="selected === '' ? 'bg-blue-600/15 text-gray-900 dark:text-white font-medium' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-200/70 dark:hover:bg-white/5'">
                <span>All ${label}</span>
                <span class="text-xs text-gray-500">${total}</span>
            </button>
            <button repeat.for="row of rows" click.trigger="select(row.path)" data-testid="folder-row" role="treeitem"
                css="padding-left: ${12 + row.depth * 14}px"
                class="w-full flex items-center justify-between gap-2 pr-3 py-1.5 text-sm text-left transition-colors"
                class.bind="selected === row.path ? 'bg-blue-600/15 text-gray-900 dark:text-white font-medium' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-200/70 dark:hover:bg-white/5'">
                <span class="truncate">&#128193; ${row.name}</span>
                <span class="text-xs text-gray-500">${row.count}</span>
            </button>
        </div>
    </div>
</template>
